# Webhook event catalog. The postprocess script injects these into the
# top-level `webhooks:` block of the OpenAPI spec, plus a `Webhook.<Event>`
# schema in `components.schemas` for each one.
#
# The OpenAPI 3.1 `webhooks:` block declares operations Orgo *sends* to the
# subscriber (the inverse of normal endpoints). Mintlify renders each one in
# the playground under a "Webhooks" section.
#
# Each entry below produces:
#   - A `Webhook.<EventName>` schema (the full envelope including the
#     envelope fields and a typed `object` field)
#   - A `webhooks: { <event>: { post: ... } }` entry pointing at the schema
#
# The envelope (id, event, api_version, created, tenant_id, request, ...) is
# generated by the script and reused across every event — only `object` and
# `previous_attributes` differ per event type.

events:

  # ── Users ──────────────────────────────────────────────────────────────────

  - event: user.created
    summary: User created
    description: |
      Fires when a new User is created — through self-registration, admin
      creation, OAuth signup, or successful adhesion. The `object` is the
      full user with read-group fields.
    object_example:
      "@id": "/api/v1/users/42"
      id: 42
      firstName: "James"
      lastName: "Patterson"
      fullName: "James Patterson"
      email: "james.patterson@example.com"
      status: "NEW"
      isEmailConfirmed: false
      localCenter:
        "@id": "/api/v1/local_centers/4"
        id: 4
        name: "Boston"
      dateCreated: "2026-01-15T10:30:00+00:00"
    previous_attributes_example: null

  - event: user.updated
    summary: User updated
    description: |
      Fires when a User's profile, status, or relationships change. The
      `object` is the full user post-change; `previous_attributes` carries
      only the fields that changed.
    object_example:
      "@id": "/api/v1/users/42"
      id: 42
      firstName: "James"
      lastName: "Patterson"
      email: "james.patterson@example.com"
      status: "ACTIVE"
      isFullMember: true
    previous_attributes_example:
      status: "NEW"
      isFullMember: false

  - event: user.deleted
    summary: User deleted
    description: |
      Fires when a User is permanently deleted (irreversible — distinct from
      soft-deletion via status `INACTIVE`). The `object` is the last-known
      state of the user before deletion.
    object_example:
      "@id": "/api/v1/users/42"
      id: 42
      firstName: "James"
      lastName: "Patterson"
      email: "james.patterson@example.com"
    previous_attributes_example: null

  # ── Payments ───────────────────────────────────────────────────────────────

  - event: product_payment.created
    summary: Payment created
    description: |
      Fires the moment a payment is initiated — Stripe checkout started,
      bank-transfer invoice issued, manual entry by treasurer. Status will
      typically be `PENDING` at this point.
    object_example:
      "@id": "/api/v1/product_payments/107"
      id: 107
      status: "PENDING"
      amount: 5000
      currency: "USD"
      method: "CARD"
      product:
        "@id": "/api/v1/products/01938d8e-c2f4-7c2a-b8e1-3f7a9b8c4f99"
        id: 22
        name: "Annual Membership 2026"
      user:
        "@id": "/api/v1/users/42"
        id: 42
        fullName: "James Patterson"
      dateCreated: "2026-01-15T10:30:00+00:00"
    previous_attributes_example: null

  - event: product_payment.updated
    summary: Payment updated
    description: |
      Fires when a payment's status, amount, or metadata changes — payment
      captured, refunded, marked-as-paid for bank transfers, etc. Use
      `previous_attributes.status` to detect the transition.
    object_example:
      "@id": "/api/v1/product_payments/107"
      id: 107
      status: "SUCCESS"
      amount: 5000
      currency: "USD"
      datePaid: "2026-01-15T10:32:14+00:00"
    previous_attributes_example:
      status: "PENDING"
      datePaid: null

  - event: product_payment.deleted
    summary: Payment deleted
    description: |
      Fires when a payment record is hard-deleted. Rare — refunds and
      cancellations update status rather than delete. Mostly emitted from
      admin cleanup of erroneous duplicate entries.
    object_example:
      "@id": "/api/v1/product_payments/107"
      id: 107
      status: "CANCELED"
    previous_attributes_example: null

  # ── Event attendance ───────────────────────────────────────────────────────

  - event: event_attend.created
    summary: Event registration created
    description: |
      Fires when someone registers for an event — Member self-registers,
      admin registers them, external invite is accepted. Use to send your
      own confirmation emails or sync to a third-party event-mgmt tool.
    object_example:
      "@id": "/api/v1/event_attends/1042"
      id: 1042
      status: "NEW"
      event:
        "@id": "/api/v1/events/01938d8e-9c4f-7c2a-b8e1-3f7a9b8c4f12"
        id: 12
        name: "Annual General Meeting 2026"
      user:
        "@id": "/api/v1/users/42"
        id: 42
        fullName: "James Patterson"
      dateCreated: "2026-01-15T10:30:00+00:00"
    previous_attributes_example: null

  - event: event_attend.updated
    summary: Event registration updated
    description: |
      Fires when the registration's status changes — confirmed by admin,
      checked in at the door, marked no-show. Also fires when guest tickets
      are added or removed.
    object_example:
      "@id": "/api/v1/event_attends/1042"
      id: 1042
      status: "CONFIRMED"
      dateConfirmed: "2026-01-15T18:02:00+00:00"
    previous_attributes_example:
      status: "NEW"
      dateConfirmed: null

  - event: event_attend.deleted
    summary: Event registration deleted
    description: |
      Fires when a registration is canceled. Capacity is returned to the
      pool. Refunds (if any) are handled separately as `product_payment.updated`.
    object_example:
      "@id": "/api/v1/event_attends/1042"
      id: 1042
      status: "NEW"
    previous_attributes_example: null

  # ── Contracts ──────────────────────────────────────────────────────────────

  - event: contract_user.created
    summary: Contract assigned to a user
    description: |
      Fires when a Contract template is assigned to a User or Contact via
      `POST /api/v1/contract_users`. Useful for triggering signature-chase
      reminders, or projecting the assignment into your compliance system.
    object_example:
      "@id": "/api/v1/contract_users/63"
      id: 63
      status: "UNSIGNED"
      contract:
        "@id": "/api/v1/contracts/9"
        id: 9
        name: "Member Agreement 2026"
      user:
        "@id": "/api/v1/users/42"
        id: 42
        fullName: "James Patterson"
      validityStartDate: "2026-01-15"
      validityEndDate: "2027-01-14"
      dateCreated: "2026-01-15T10:30:00+00:00"
    previous_attributes_example: null

  - event: contract_user.updated
    summary: Contract signed or status changed
    description: |
      Fires when a contract-user record's signature state changes — typically
      `UNSIGNED → SIGNED → COMPLETE`. `previous_attributes.status` is the
      reliable signal that a signature just happened.
    object_example:
      "@id": "/api/v1/contract_users/63"
      id: 63
      status: "SIGNED"
      dateSigned: "2026-01-15T11:45:00+00:00"
      signedPdfUrl: "https://cdn.orgo.space/contracts/signed/63.pdf"
    previous_attributes_example:
      status: "UNSIGNED"
      dateSigned: null

  - event: contract_user.deleted
    summary: Contract assignment deleted
    description: |
      Fires when an unsigned contract-user record is removed (e.g., via
      `ask-resign` which cancels all unsigned instances of a contract).
    object_example:
      "@id": "/api/v1/contract_users/63"
      id: 63
      status: "UNSIGNED"
    previous_attributes_example: null

  # ── Roles ──────────────────────────────────────────────────────────────────

  - event: user_role.created
    summary: Role assigned to a user
    description: |
      Fires when a User is granted a role on a Unit — promotion to chapter
      lead, treasurer assignment, etc. Useful for sync to external
      permission systems (Slack channels, GitHub teams).
    object_example:
      "@id": "/api/v1/user_roles/199"
      id: 199
      user:
        "@id": "/api/v1/users/42"
        id: 42
        fullName: "James Patterson"
      role:
        "@id": "/api/v1/roles/12"
        id: 12
        name: "Chapter Lead"
      unit:
        "@id": "/api/v1/units/4"
        id: 4
        name: "Boston"
      dateCreated: "2026-01-15T10:30:00+00:00"
    previous_attributes_example: null

  - event: user_role.updated
    summary: Role assignment updated
    description: |
      Fires when a role assignment's properties change (scope adjustment,
      validity dates, custom attributes). The role itself is immutable — to
      "change a role", delete the old assignment and create a new one.
    object_example:
      "@id": "/api/v1/user_roles/199"
      id: 199
      validityEndDate: "2027-01-15"
    previous_attributes_example:
      validityEndDate: null

  - event: user_role.deleted
    summary: Role assignment revoked
    description: |
      Fires when a role assignment is removed. Permission re-evaluation
      happens immediately on the next API call; cached JWT roles take
      effect on the next refresh.
    object_example:
      "@id": "/api/v1/user_roles/199"
      id: 199
    previous_attributes_example: null

  # ── Contacts ───────────────────────────────────────────────────────────────

  - event: contact.created
    summary: Contact created
    description: |
      Fires when a new Contact is created — manually entered, imported from
      CSV, generated from a public form submission, or auto-created from
      an event invitation.
    object_example:
      "@id": "/api/v1/contacts/85"
      id: 85
      name: "Olivia Brown"
      email: "olivia.brown@example.com"
      phone: "+1 415 555 0192"
      source: "MANUAL"
      isNewsletterSubscribed: false
      localCenter:
        "@id": "/api/v1/local_centers/4"
        id: 4
        name: "Boston"
      dateCreated: "2026-01-15T10:30:00+00:00"
    previous_attributes_example: null

  - event: contact.updated
    summary: Contact updated
    description: |
      Fires when a Contact's profile changes — newsletter opt-in/out, tag
      added/removed, custom field update. Use `previous_attributes` to
      detect specific transitions (unsubscribes, status changes).
    object_example:
      "@id": "/api/v1/contacts/85"
      id: 85
      name: "Olivia Brown"
      email: "olivia.brown@example.com"
      isNewsletterSubscribed: false
    previous_attributes_example:
      isNewsletterSubscribed: true

  - event: contact.deleted
    summary: Contact deleted
    description: |
      Fires when a Contact is permanently deleted. Contacts with successful
      product payments cannot be deleted — this event only fires for
      contacts free of financial history.
    object_example:
      "@id": "/api/v1/contacts/85"
      id: 85
      name: "Olivia Brown"
      email: "olivia.brown@example.com"
    previous_attributes_example: null
