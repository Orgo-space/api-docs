# Per-operation code samples injected as `x-codeSamples` on each operation.
# Mintlify renders these as language tabs in the API playground.
#
# Each operation includes three samples: curl, JavaScript (fetch), and PHP
# (Guzzle). They use the same persona, host, and example bodies as
# examples.yaml so the docs tell one consistent story.
#
# Persona:
#   - Host       : https://acme.orgo.space  (tenant subdomain)
#   - Auth env   : $ORGO_API_TOKEN (Bash) / process.env.ORGO_API_TOKEN (JS) / getenv('ORGO_API_TOKEN') (PHP)
#   - Member     : James Patterson (id 42, email james.patterson@example.com)

operations:

  # ── Users ──────────────────────────────────────────────────────────────────

  - operationId: api_users_post
    samples:
      - lang: cURL
        label: cURL
        source: |
          curl -X POST https://acme.orgo.space/api/v1/users \
            -H "Content-Type: application/json" \
            -d '{
              "firstName": "James",
              "lastName": "Patterson",
              "email": "james.patterson@example.com",
              "plainPassword": "Sup3rSecret!2026",
              "localCenter": "/api/v1/local_centers/4",
              "type": "/api/v1/roles/12"
            }'
      - lang: JavaScript
        label: JavaScript (fetch)
        source: |
          const res = await fetch("https://acme.orgo.space/api/v1/users", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
              firstName: "James",
              lastName: "Patterson",
              email: "james.patterson@example.com",
              plainPassword: "Sup3rSecret!2026",
              localCenter: "/api/v1/local_centers/4",
              type: "/api/v1/roles/12",
            }),
          });
          const user = await res.json();
      - lang: PHP
        label: PHP (Guzzle)
        source: |
          use GuzzleHttp\Client;

          $client = new Client(['base_uri' => 'https://acme.orgo.space']);
          $response = $client->post('/api/v1/users', [
              'json' => [
                  'firstName'     => 'James',
                  'lastName'      => 'Patterson',
                  'email'         => 'james.patterson@example.com',
                  'plainPassword' => 'Sup3rSecret!2026',
                  'localCenter'   => '/api/v1/local_centers/4',
                  'type'          => '/api/v1/roles/12',
              ],
          ]);
          $user = json_decode($response->getBody(), true);

  - operationId: api_users_id_get
    samples:
      - lang: cURL
        label: cURL
        source: |
          curl https://acme.orgo.space/api/v1/users/42 \
            -H "Api-Token: $ORGO_API_TOKEN"
      - lang: JavaScript
        label: JavaScript (fetch)
        source: |
          const res = await fetch("https://acme.orgo.space/api/v1/users/42", {
            headers: { "Api-Token": process.env.ORGO_API_TOKEN },
          });
          const user = await res.json();
      - lang: PHP
        label: PHP (Guzzle)
        source: |
          $response = $client->get('/api/v1/users/42', [
              'headers' => ['Api-Token' => getenv('ORGO_API_TOKEN')],
          ]);
          $user = json_decode($response->getBody(), true);

  - operationId: api_users_get_collection
    samples:
      - lang: cURL
        label: cURL
        source: |
          curl "https://acme.orgo.space/api/v1/users?status=ACTIVE&localCenter=/api/v1/local_centers/4&itemsPerPage=50" \
            -H "Api-Token: $ORGO_API_TOKEN" \
            -H "Accept: application/ld+json"
      - lang: JavaScript
        label: JavaScript (fetch)
        source: |
          const params = new URLSearchParams({
            status: "ACTIVE",
            localCenter: "/api/v1/local_centers/4",
            itemsPerPage: "50",
          });
          const res = await fetch(
            `https://acme.orgo.space/api/v1/users?${params}`,
            {
              headers: {
                "Api-Token": process.env.ORGO_API_TOKEN,
                Accept: "application/ld+json",
              },
            },
          );
          const { "hydra:member": users, "hydra:totalItems": total } = await res.json();
      - lang: PHP
        label: PHP (Guzzle)
        source: |
          $response = $client->get('/api/v1/users', [
              'headers' => [
                  'Api-Token' => getenv('ORGO_API_TOKEN'),
                  'Accept'    => 'application/ld+json',
              ],
              'query' => [
                  'status'       => 'ACTIVE',
                  'localCenter'  => '/api/v1/local_centers/4',
                  'itemsPerPage' => 50,
              ],
          ]);
          $data = json_decode($response->getBody(), true);
          $users = $data['hydra:member'];
          $total = $data['hydra:totalItems'];

  - operationId: me
