          const me = await res.json();
      - lang: PHP
        label: PHP (Guzzle)
        source: |
          $response = $client->get('/api/v1/me', [
              'headers' => ['Authorization' => 'Bearer ' . $jwt],
          ]);
          $me = json_decode($response->getBody(), true);

