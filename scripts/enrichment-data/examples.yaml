# Hand-curated request/response examples for the top 30 endpoints.
#
# These override the schema-synthesized examples for the operations listed
# below. Synthesized examples cover the long tail of ~700 other operations;
# this file is where we polish the operations that integration developers
# actually hit first.
#
# Format:
#   operations:
#     - operationId: <openapi operationId>
#       request:
#         <content-type or "*">:
#           summary: "<one-line label>"
#           value: { ... JSON ... }
#       response:
#         "<status code>":
#           <content-type or "*">:
#             summary: "<one-line label>"
#             value: { ... JSON ... }
#
# Persona — consistent across every example to give the docs a single story:
#   - Tenant subdomain  : acme.orgo.space  (org: "Civic Collective")
#   - Local centers     : Boston (id 4), Manchester (id 7), San Francisco (id 12)
#   - Cast              : James Patterson, Emma Whitfield, Sarah O'Connor, Michael Chen
#   - Anchor date       : 2026-01-15
#   - Currency          : USD
#
# All emails use the RFC 2606 reserved domain `example.com`. Phone numbers
# use NANP 555 reserved fictional ranges. No real PII.

operations:

  # ═══════════════════════════════════════════════════════════════════════════
