          plainPassword: "Sup3rSecret!2026"
          localCenter: "/api/v1/local_centers/4"
          type: "/api/v1/roles/12"
          phoneNumber: "+1 415 555 0142"
          dateBirth: "1990-04-22T00:00:00+00:00"
          gender: "M"
          language: "en"
          timezone: "America/New_York"
          isRegisterAsMember: true
    response:
      "201":
        application/json:
          summary: "Member created, email verification pending"
          value:
            id: 42
            firstName: "James"
            lastName: "Patterson"
            fullName: "James Patterson"
            email: "james.patterson@example.com"
            status: "NEW"
            isEmailConfirmed: false
            localCenter:
              id: 4
